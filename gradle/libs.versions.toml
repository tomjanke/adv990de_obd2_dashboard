[versions]
agp = "9.4.1"
kotlin = "2.4.21"
sentry = "8.60.0"
# Compose 1.12 (BOM 2026.09.00) verlangt compileSdk 37 und damit AGP 9.4 + Gradle 9.6 (seit v1.26.0: AGP 9.4.1, Gradle 9.6.1, compileSdk 37).
# Kotlin 2.4.21 ist offiziell bis Gradle 9.7.0 und AGP 9.3.1 freigegeben (kotlinlang.org, Abfrage 2026-10-12); AGP 9.4 ist darueber hinaus —
# der Build laeuft, ein Kotlin-Update bringt voraussichtlich die Freigabe fuer AGP 9.4 nach.
compose-bom = "2026.09.00"
# `kotlin` steht auch im buildscript-Block des Root-build.gradle.kts (kotlin-gradle-plugin-Pin) — beide gemeinsam aendern (BuildIntegrityTest).
hilt = "2.60.1"
room = "2.8.5"
navigation = "2.10.2"
datastore = "1.2.1"
coroutines = "1.11.0"
mockk = "1.14.11"
lifecycle = "2.11.0"
appcompat = "1.8.0"
paging = "3.5.2"
kotlinx-serialization = "1.11.0"

[libraries]
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.19.1" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version = "1.13.0" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Material Icons were removed from compose-bom in 2025+; pinned to last 1.7.x release.
compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core", version = "1.7.8" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version = "1.7.8" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version = "1.4.0" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
junit = { group = "junit", name = "junit", version = "4.13.2" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
room-paging = { group = "androidx.room", name = "room-paging", version.ref = "room" }
androidx-test-runner = { group = "androidx.test", name = "runner", version = "1.7.0" }
# Reference org.json impl for JVM unit tests: android.jar ships org.json as a stub (every method
# throws or, with isReturnDefaultValues=true, silently returns null/0/false) — without this on the
# test classpath, OpenMeteoApiTest's JSON parsing never actually runs. Verified latest on Maven
# Central (repo1.maven.org/maven2/org/json/json/), 2026-09-27.
json = { group = "org.json", name = "json", version = "20260814" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
paging-runtime = { group = "androidx.paging", name = "paging-runtime-ktx", version.ref = "paging" }
paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }
# Nur der Kern: das Sammelpaket io.sentry:sentry-android zieht den Native-Handler (libsentry.so, ~0,5-0,7 MB je ABI) und Replay
# nach, die die App nicht braucht (kein eigener Native-Code, keine Bildschirmaufzeichnung). QS B33.
sentry-android-core = { module = "io.sentry:sentry-android-core", version.ref = "sentry" }
mockk-android = { group = "io.mockk", name = "mockk-android", version.ref = "mockk" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version = "1.3.0" }
androidx-test-rules = { group = "androidx.test", name = "rules", version = "1.7.0" }
# Compose ui-test zieht transitiv ein aelteres Espresso, das die versteckte API
# InputManager.getInstance() per Reflection aufruft — die gibt es ab Android 17 nicht mehr.
# Explizit auf 3.7.0 gehoben, damit die Compose-UI-Tests auf aktuellen Geraeten laufen.
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version = "3.7.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version = "2.3.11" }
