org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Gradle laedt kein JDK von selbst nach: Fuer Toolchain-Downloads gibt es keine Pruefsumme (Daemon-JVM-Kriterien in
# gradle/gradle-daemon-jvm.properties, Aufloesung ueber den foojay-Resolver). Das JDK 21 (JetBrains) installiert man einmal selbst
# (Android Studio bringt die JBR mit, ~/.gradle/jdks wird gefunden) — oder laedt es bewusst einmal mit
# `./gradlew -Porg.gradle.java.installations.auto-download=true help` nach. BuildIntegrityTest haelt die Zeile fest.
org.gradle.java.installations.auto-download=false
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official
